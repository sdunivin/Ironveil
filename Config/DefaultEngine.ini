; Settings Ironveil's C++ needs. If your own project already has a DefaultEngine.ini,
; merge these sections into it instead of replacing it.

[/Script/EngineSettings.GameMapsSettings]
; Tools/unreal/setup_ironveil_content.py creates L_Spire and points these at it.
; Until then the empty engine Entry map works: the game mode builds everything at runtime.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/IronVeil.ArpgGameMode

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/IronVeil")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/IronVeil")
